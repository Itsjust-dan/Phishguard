<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishGuard Warning</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center;
           justify-content:center; background:#7f1d1d; color:#fff;
           font-family:Arial,sans-serif; text-align:center; padding:24px;
           box-sizing:border-box; }
    main { max-width:600px; }
    h1 { font-size:2rem; }
    .box { background:#450a0a; padding:12px; border-radius:8px;
           word-break:break-all; margin:12px 0; }
    button { padding:12px 20px; cursor:pointer; font-size:1rem; }
    a { display:block; margin-top:20px; color:#fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>PhishGuard Warning</h1>
    <p>This website has been flagged as potentially dangerous.</p>
    <div class="box" id="site"></div>
    <div class="box" id="reasons"></div>
    <button id="close">Close this tab</button>
    <a href="#" id="proceed">Proceed anyway (not recommended)</a>
  </main>
  <script src="warning.js"></script>
</body>
</html>
